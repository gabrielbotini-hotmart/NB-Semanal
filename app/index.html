<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New Business · Semanal</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* ===== TOKENS — Stravix admin (minimalista, arejado) × laranja Hotmart ===== */
  :root{
    --orange:#FF4000; --orange-600:#E23A00; --orange-050:#FFF1EC; --orange-100:#FFE0D4;
    --ink:#101828; --white:#FFFFFF;
    --bg:#F4F5F4; --surface:#FFFFFF; --surface-2:#F8F9FA; --surface-sunken:#F3F4F3;
    --sidebar:#FFFFFF;
    --border:#EDECE9; --border-2:#E4E6E4;
    --text:#101828; --text-muted:#667085; --text-faint:#98A2B3;
    --accent:var(--orange); --accent-weak:var(--orange-050);
    --success:#12B76A; --success-bg:#ECFDF3; --warn:#F79009; --warn-bg:#FFFAEB;
    --danger:#F04438; --danger-bg:#FEF3F2; --danger-text:#F04438;
    --track:#EFF0EF;
    /* aliases legados usados pelo JS (categorias = laranja + cinzas) */
    --black:#101828; --off-white:var(--bg); --blue:#7A8699; --purple:#B0AAA2;
    --maroon:var(--orange-600); --lemon:var(--success); --yellow:var(--warn); --gray:#C3BFB8;
    --surface-dark:#101828; --on-dark:#fff; --border-strong:var(--border-2);

    --sh-card:0 1px 2px rgba(16,24,40,.05); --sh-sm:0 1px 2px rgba(16,24,40,.06);
    --sh-md:0 4px 14px rgba(16,24,40,.07); --sh-lg:0 12px 32px rgba(16,24,40,.14);
    --font-sans:"DM Sans","Inter","Arial",sans-serif; --font-mono:"DM Mono",ui-monospace,monospace;
    --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px; --sp-6:32px; --sp-7:48px; --sp-8:64px;
    --r-sm:10px; --r-md:16px; --r-lg:20px; --r-pill:999px;
    --sidebar-w:236px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:var(--font-sans);background:var(--bg);color:var(--text);line-height:1.5;-webkit-font-smoothing:antialiased}
  .mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
  ::selection{background:var(--orange);color:#fff}
  .eyebrow{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-faint)}

  /* ===== LAYOUT ===== */
  .layout{display:flex;min-height:100vh}
  .scrim{display:none}
  .sidebar{width:var(--sidebar-w);flex:none;background:var(--sidebar);border-right:1px solid var(--border);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:18px 14px}
  .side-brand{display:flex;align-items:center;padding:8px 8px 18px}
  .side-logo .hotmark{display:block;font-size:22px;font-weight:700;letter-spacing:-.045em;color:var(--orange);line-height:1}
  .side-logo small{display:block;margin-top:6px;color:var(--text-faint);font-weight:600;font-size:10px;letter-spacing:.08em;text-transform:uppercase}
  .side-nav{display:flex;flex-direction:column;gap:4px;margin-top:4px}
  .side-nav .tab{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;font-size:13.5px;font-weight:600;color:var(--text-muted);cursor:pointer;transition:background .15s,color .15s}
  .side-nav .tab .ic{width:18px;height:18px;flex:none;display:inline-flex;align-items:center;justify-content:center}
  .side-nav .tab .ic svg{width:18px;height:18px;stroke-width:2}
  .side-nav .tab:hover{background:var(--surface-2);color:var(--text)}
  .side-nav .tab.on{background:var(--accent);color:#fff;box-shadow:0 8px 18px rgba(255,64,0,.26)}
  .side-foot{margin-top:auto;padding-top:14px}
  .side-note{background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:12px 14px;font-size:11px;color:var(--text-muted);line-height:1.5}
  .side-note b{color:var(--text)}

  .main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg)}
  .appbar{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.82);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:16px;padding:12px 26px;min-height:64px}
  .menu-btn{display:none;background:var(--surface);border:1px solid var(--border-2);border-radius:10px;width:38px;height:38px;font-size:17px;cursor:pointer;color:var(--text);align-items:center;justify-content:center;flex:none}
  .appbar-title h1{font-size:19px;font-weight:700;letter-spacing:-.02em}
  .appbar-title .crumb{font-size:12px;color:var(--text-faint);margin-top:1px}
  .appbar-right{margin-left:auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:flex-end}
  .profile{display:flex;align-items:center;gap:9px}
  .profile .pf b{font-size:13px;display:block;line-height:1.15}
  .profile .pf small{font-size:11px;color:var(--text-faint)}

  .controls{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
  .ctl{display:flex;flex-direction:column;gap:4px}
  .ctl label{font-size:9px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--text-faint)}
  select.sel{font-family:inherit;font-size:13px;font-weight:600;color:var(--text);background:var(--surface);border:1px solid var(--border-2);border-radius:10px;padding:8px 10px;cursor:pointer;max-width:130px;outline:none}
  select.sel:focus{border-color:var(--accent)}
  #selSemana,#selSemanaArea{max-width:150px}

  .subbar{padding:16px 26px 0}
  .subbar #subtabs{display:inline-flex;gap:4px;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:4px}
  .subtab{cursor:pointer;padding:7px 16px;border-radius:9px;font-weight:600;font-size:12.5px;color:var(--text-muted)}
  .subtab:hover{color:var(--text)}
  .subtab.on{background:var(--surface);color:var(--accent);box-shadow:var(--sh-sm)}

  .banner{display:flex;align-items:center;gap:8px;padding:16px 26px 0;font-size:12px;color:var(--text-muted)}
  .banner .dotmini{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none}
  .banner b{color:var(--text)}

  .content{padding:24px 26px 24px;display:flex;flex-direction:column}
  .pagefoot{padding:20px 26px 40px;color:var(--text-faint);font-size:12px}

  .sec{margin-bottom:32px}
  /* um grid (ex.: linha de KPIs, ou o par estoque/status) não tem margin-bottom próprio;
     garante respiro antes do bloco seguinte pra o título não colar. */
  .grid+.sec,.grid+.grid{margin-top:32px}
  .sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
  .sec-head h2{font-size:17px;font-weight:700;letter-spacing:-.015em}
  .sec-head .hint{font-size:12px;color:var(--text-faint)}
  /* toggle Semana/Mês dos gráficos de Estoque/Status (Semanal Área) */
  .gtoggle{display:flex;gap:2px;background:var(--bg);padding:3px;border-radius:8px}
  .gtoggle button{cursor:pointer;border:none;background:transparent;padding:5px 12px;border-radius:6px;font-size:12px;font-weight:600;color:var(--text-muted)}
  .gtoggle button.on{background:var(--surface);color:var(--accent);box-shadow:var(--sh-sm)}

  .grid{display:grid;gap:16px}
  .g8{grid-template-columns:repeat(4,1fr)} .g7{grid-template-columns:repeat(7,1fr)} .g6{grid-template-columns:repeat(6,1fr)} .g5{grid-template-columns:repeat(5,1fr)} .g4{grid-template-columns:repeat(4,1fr)}
  .g3{grid-template-columns:repeat(3,1fr)} .g2{grid-template-columns:repeat(2,1fr)}
  @media(max-width:1180px){.g7{grid-template-columns:repeat(4,1fr)}.g6,.g5{grid-template-columns:repeat(3,1fr)}}
  @media(max-width:920px){.g8,.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr}}
  @media(max-width:640px){.g8,.g7,.g6,.g5,.g4,.g2{grid-template-columns:1fr}}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:20px;box-shadow:var(--sh-card);position:relative;overflow:hidden}

  /* KPI stat */
  /* estrutura fixa título / corpo / rodapé — evita os componentes "sambarem" entre cards:
     o título sempre ocupa 2 linhas e o rodapé (.sub) fica ancorado no fundo. */
  .kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:20px;box-shadow:var(--sh-card);position:relative;display:flex;flex-direction:column;min-height:128px}
  .kpi .rail{display:none}
  .kpi .lbl{font-size:12.5px;font-weight:700;color:var(--text);margin-bottom:2px}
  .kpi .sub2{font-size:11px;color:var(--text-faint);line-height:1.35;margin-bottom:14px;min-height:30px}
  .kpi .num{font-size:27px;font-weight:700;color:var(--text);line-height:1.1;letter-spacing:-.02em}
  .kpi .num.n{color:var(--text)}
  .kpi .sub{font-size:12px;color:var(--text-muted);margin-top:auto;padding-top:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
  .kpi .prog{height:8px;background:var(--track);border-radius:var(--r-pill);overflow:hidden;margin-top:14px}
  .kpi .prog i{display:block;height:100%;background:var(--accent);border-radius:var(--r-pill)}
  .att{font-weight:700;font-family:var(--font-sans);font-size:11px;padding:3px 9px;border-radius:var(--r-pill);display:inline-flex;align-items:center;gap:3px;white-space:nowrap}
  .att.hi{color:var(--success);background:var(--success-bg)} .att.mid{color:#B54708;background:var(--warn-bg)} .att.lo{color:var(--danger);background:var(--danger-bg)}
  .attText{font-weight:700}
  .attText.hi{color:var(--success)} .attText.mid{color:#B54708} .attText.lo{color:var(--danger)}

  /* funnel */
  .funnel{display:flex;flex-direction:column;gap:3px}
  .fstage{display:grid;grid-template-columns:120px 1fr;align-items:center;gap:14px}
  .fstage .nm{text-align:right;font-size:13px;font-weight:600}
  .fstage .track{height:36px;background:var(--track);border-radius:10px;position:relative;overflow:hidden}
  .fstage .fill{height:100%;border-radius:10px;display:flex;align-items:center;padding-left:12px;color:#fff;font-weight:700;font-size:14px;min-width:44px}
  .fstage .bud{position:absolute;top:-3px;bottom:-3px;width:2.5px;background:var(--text);opacity:.45}
  .fstage .bud::after{content:attr(data-b);position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:9.5px;color:var(--text-muted);white-space:nowrap;font-family:var(--font-mono)}
  .conv{grid-column:2;font-size:10.5px;font-weight:700;color:var(--text-faint);font-family:var(--font-mono);padding-left:2px}

  /* bars */
  .barrow{margin-bottom:16px} .barrow:last-child{margin-bottom:0}
  .barrow .top{display:flex;justify-content:space-between;font-size:12.5px;font-weight:600;margin-bottom:6px}
  .barrow .top .v{font-family:var(--font-mono)}
  .barrow .bar{height:10px;background:var(--track);border-radius:var(--r-pill);overflow:hidden;position:relative}
  .barrow .bar i{display:block;height:100%;border-radius:var(--r-pill)}
  .barrow .bar .tgt{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--text);opacity:.4}

  /* tiles */
  .tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:var(--sp-4);text-align:center;box-shadow:var(--sh-card)}
  .tile .v{font-size:25px;font-weight:700;color:var(--text);line-height:1;font-family:var(--font-mono)}
  .tile .k{font-size:11px;color:var(--text-muted);margin-top:6px}

  /* trend */
  .b{border-radius:5px 5px 0 0}
  .trend{display:flex;align-items:flex-end;gap:4px;height:150px;padding-top:20px}
  .trend .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
  .trend .b{width:100%;max-width:26px;background:var(--accent);border-radius:5px 5px 0 0;position:relative;transition:height .2s}
  .trend .b:hover{background:var(--orange-600)}
  .trend .cap{font-size:8.5px;color:var(--text-faint);font-family:var(--font-mono);white-space:nowrap;transform:rotate(-45deg);transform-origin:center;margin-top:6px}

  /* estoque do funil SDR — barras empilhadas (snapshot por semana) */
  .estoque{display:flex;align-items:flex-end;gap:4px;min-height:236px;padding-top:8px;padding-bottom:2px}
  .ecol{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
  .etot{font-family:var(--font-mono);font-size:9px;font-weight:700;color:var(--text-muted);margin-bottom:4px;white-space:nowrap}
  .eseg{width:100%;max-width:46px;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .eseglbl{font-size:8.5px;font-weight:700;color:#101828;line-height:1}
  .eseg:first-of-type{border-radius:5px 5px 0 0}
  .ecap{font-size:8.5px;color:var(--text-faint);font-family:var(--font-mono);white-space:nowrap;transform:rotate(-45deg);transform-origin:center;margin-top:8px}
  .edata-lbl{font-size:10px;font-weight:700;color:var(--text-faint);text-transform:uppercase;letter-spacing:.04em;margin-top:14px;border-top:1px solid var(--border);padding-top:8px}
  .edata{display:flex;gap:4px;margin-top:4px}
  .edcell{flex:1;min-width:0;text-align:center;font-family:var(--font-mono);font-size:9.5px;font-weight:700;color:var(--text-muted)}

  /* weektrend */
  .wtgrid{display:grid;gap:18px} .wt{min-width:0}
  .wttop{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;gap:8px;flex-wrap:wrap}
  .wtlabel{font-size:12.5px;font-weight:600} .wtsub{color:var(--text-faint);font-weight:500;font-size:11px}
  .nivpill{background:var(--accent);color:#fff;padding:3px 11px;border-radius:8px;font-weight:700;display:inline-block}
  /* card KPI em destaque (laranja, igual ao item ativo do menu) */
  .kpi.kpi-accent{background:var(--accent);border-color:var(--accent)}
  .kpi.kpi-accent .lbl,.kpi.kpi-accent .sub2,.kpi.kpi-accent .num,.kpi.kpi-accent .num.n,.kpi.kpi-accent .sub,.kpi.kpi-accent .sub>span{color:#fff}
  .kpi-ic{position:absolute;top:16px;right:16px;width:32px;height:32px;border-radius:9px;background:var(--orange-050);color:var(--accent);display:flex;align-items:center;justify-content:center;pointer-events:none}
  .kpi-ic svg{width:17px;height:17px}
  .kpi.kpi-accent .kpi-ic{background:rgba(255,255,255,.22);color:#fff}
  .kpi:has(.kpi-ic) .lbl,.kpi:has(.kpi-ic) .sub2{padding-right:40px}
  .card-hd{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .card-ic{width:28px;height:28px;border-radius:8px;background:var(--orange-050);color:var(--accent);display:flex;align-items:center;justify-content:center;flex:none}
  .card-ic svg{width:16px;height:16px}
  .card-hd h3{font-size:14px;font-weight:700;margin:0;letter-spacing:-.01em}
  .card-hd .card-sub{font-size:11px;color:var(--text-faint);margin-left:auto;text-align:right;max-width:50%;line-height:1.3}
  .tbl-hd{padding:16px 18px 0}
  .wtwow{font-family:var(--font-sans);font-size:11px;font-weight:700;padding:2px 8px;border-radius:var(--r-pill)}
  .wtwow.up{color:var(--success);background:var(--success-bg)} .wtwow.down{color:var(--danger);background:var(--danger-bg)}
  .wtchart{display:flex;align-items:flex-end;gap:7px}
  .wtcol{flex:1;display:flex;flex-direction:column;align-items:center;min-width:0}
  .wtplot{position:relative;width:100%;height:100px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;border-bottom:1px solid var(--border)}
  .wttgt{position:absolute;left:-4px;right:-4px;height:0;border-top:2px dashed var(--text);opacity:.55;pointer-events:none}
  .wtval{font-family:var(--font-mono);font-size:10px;font-weight:600;color:var(--text-muted);margin-bottom:3px;white-space:nowrap}
  .wtval.cur{font-weight:700;color:var(--text)}
  .wtbar{width:100%;max-width:28px;border-radius:5px 5px 0 0}
  .wtlbl{font-size:9.5px;color:var(--text-faint);font-weight:500;margin-top:5px}
  .wtlbl.cur{color:var(--text);font-weight:700}
  .wtlegend{display:flex;gap:16px;flex-wrap:wrap;font-size:11px;color:var(--text-faint);margin-top:14px}
  .wtlegend .sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:middle}

  /* table */
  table.tbl{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden;font-size:12.5px;box-shadow:var(--sh-card)}
  table.tbl thead th{background:var(--surface);color:var(--text-faint);text-align:left;font-weight:700;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;padding:12px 16px;white-space:nowrap;border-bottom:1px solid var(--border)}
  table.tbl thead th.sortable{cursor:pointer;user-select:none}
  table.tbl thead tr.tbl-grouphd th{text-align:center;padding:10px 16px 4px;border-bottom:none;color:var(--text);font-size:13px;font-weight:700}
  table.tbl thead tr.tbl-grouphd+tr th{padding-top:2px}
  .th-ic{display:inline-flex;vertical-align:-2px;margin-right:4px}
  .th-ic svg{width:12px;height:12px}
  table.tbl thead th.sortable:hover{color:var(--accent)}
  table.tbl th.r,table.tbl td.r{text-align:right}
  table.tbl th.c,table.tbl td.c{text-align:center}
  table.tbl td{padding:12px 16px;border-top:1px solid var(--border)}
  table.tbl tbody tr:first-child td{border-top:none}
  table.tbl tbody tr.rankrow{cursor:pointer}
  table.tbl tbody tr.rankrow:hover{background:var(--surface-2)}
  table.tbl tbody tr.grouprow td{background:var(--surface-2);font-weight:700;font-size:12px;color:var(--text-muted)}
  .num-cell{font-family:var(--font-mono);color:var(--accent);font-weight:700}
  .idx{color:var(--text-faint);margin-right:8px}
  .rankbar{height:7px;background:var(--track);border-radius:var(--r-pill);overflow:hidden;min-width:60px}
  .rankbar i{display:block;height:100%;background:var(--accent);border-radius:var(--r-pill)}
  .ministack{display:flex;height:14px;width:100px;border-radius:5px;overflow:hidden}

  .legend{display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px;color:var(--text-muted);margin-top:10px}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .legend .sw{width:12px;height:12px;border-radius:4px;flex:none}
  .miss{color:var(--text-faint);font-style:italic}

  /* 1:1 Gestor */
  .oneone{display:grid;grid-template-columns:260px 1fr;gap:18px;align-items:start}
  .oneone-side{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:14px;max-height:80vh;overflow-y:auto;position:sticky;top:88px;box-shadow:var(--sh-card)}
  .oneone-side input{width:100%;border:1px solid var(--border-2);border-radius:10px;padding:9px 12px;font-size:13px;font-family:inherit;outline:none;margin-bottom:8px;background:var(--surface)}
  .oneone-side input:focus{border-color:var(--accent)}
  .oneone-item{padding:8px 10px;border-radius:10px;cursor:pointer;font-size:13px;font-weight:500;color:var(--text);display:flex;align-items:center;gap:9px}
  .oneone-item:hover{background:var(--surface-2)}
  .oneone-item.on{background:var(--accent-weak);color:var(--orange-600);font-weight:700}
  @media(max-width:860px){.oneone{grid-template-columns:1fr}.oneone-side{position:static;max-height:none}}

  .avatar{position:relative;border-radius:50%;overflow:hidden;background:var(--surface-sunken);display:flex;align-items:center;justify-content:center;flex:none}
  .avatar-fallback{font-family:var(--font-sans);font-weight:700;color:var(--text-faint);letter-spacing:.02em}
  .avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

  .statrow{display:flex;gap:26px;flex-wrap:wrap}
  .stat{text-align:right}
  .stat .v{font-family:var(--font-mono);font-size:19px;font-weight:700;margin-top:2px}
  .indic{display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid var(--border);font-size:12.5px}
  .indic:first-child{border-top:none}
  .indic .k{color:var(--text-muted)} .indic .v{font-family:var(--font-mono);font-weight:600}
  .coachgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
  @media(max-width:860px){.coachgrid{grid-template-columns:1fr}}

<script>
const $=id=>document.getElementById(id);
const D=window.DATA||{};
const STR_ORDER=D.estrategias||['Outbound','Inbound','Hunting'];
// filtros de Mês (Mensal Sales, Semanal Sales, Semanal Área) só mostram este ano — ajustar
// aqui quando virar o ano.
const FILTRO_ANO='2026';
const NIV=D.niveis||['N2-N3','N4-N5','N6+'];
// categorias: laranja (o que importa) + rampa de cinza (Stravix minimalista)
const STR_COLOR={Outbound:'var(--accent)',Inbound:'#344054',Hunting:'#98A2B3'};
const NIV_COLOR={'N2-N3':'#98A2B3','N4-N5':'#344054','N6+':'var(--accent)'};
// Donos que NÃO são SDR (pessoas mal-classificadas + contas de time/cadência). Fonte única
// usada pra classificar/filtrar em toda a página SDR. Adicionar aqui conforme aparecerem.
const NAO_SDR=new Set(['camila.harumi@hotmart.com','gustavo.duarte@hotmart.com','bubr_bizops@hotmart.com','bkf-team@hotmart.com']);
const ehNaoSdr=email=>NAO_SDR.has((email||'').toLowerCase());

// ---- formatação ----
const nf=new Intl.NumberFormat('pt-BR');
const fN=n=>n==null?'—':nf.format(Math.round(n||0));
const fBRL=n=>{if(n==null)return '—';n=n||0;const a=Math.abs(n);
  if(a>=1e6)return 'R$ '+(n/1e6).toFixed(1).replace('.',',')+' mi';
  if(a>=1e3)return 'R$ '+Math.round(n/1e3)+' mil';return 'R$ '+fN(n);};
const pct=(a,b)=>(b>0&&a!=null)?Math.round(a/b*100):null;
const pctR=r=>r==null?null:Math.round(r*100);
const attClass=p=>p==null?'':p>=100?'hi':p>=80?'mid':'lo';
const sum=(arr,f)=>arr.reduce((s,x)=>s+(f(x)||0),0);
const shortEmail=e=>(e||'').replace('@hotmart.com','');
const displayName=p=>p.nome||shortEmail(p.email);
const initials=name=>{const parts=(name||'').trim().split(/\s+/);return ((parts[0]?.[0]||'')+(parts[1]?.[0]||'')).toUpperCase()||'?';};
function avatarHTML(p,size){
  size=size||36;
  const name=displayName(p);
  const img=p.foto?`<img src="${p.foto}" alt="" loading="lazy" onerror="this.style.display='none'">`:'';
  return `<div class="avatar" style="width:${size}px;height:${size}px"><span class="avatar-fallback" style="font-size:${Math.round(size*0.38)}px">${initials(name)}</span>${img}</div>`;
}
function median(arr){const a=[...arr].filter(v=>v!=null).sort((x,y)=>x-y);const n=a.length;if(!n)return 0;return n%2?a[(n-1)/2]:(a[n/2-1]+a[n/2])/2;}

// ---- estado ----
let state={meeting:'mensal',area:'sdr',mes:null,semana:null,estr:'all',nivel:'all',ref:'budget',mesArea:null,semanaArea:null,refArea:'budget',estrArea:'all',nivelArea:'all',evolGran:'semana',onbStatusPct100:false,mesMensal:null,estrMensal:'all',refMensal:'budget',pessoa:null,sdrSort:null,closerSort:null,onbSort:null,mesOneOne:null,semanaOneOne:null,areaOneOne:'sdr',cohortTab:'all',sdrView:'tabela'};
// AREA_TABS usa as chaves da Semanal Área (sdr/closers/onboarding); o 1:1 Gestor guarda
// pessoas com outra convenção (sdr/closer/onb, ver allPeople()) — mapa entre as duas.
const AREA_TO_ONEONE_KIND={sdr:'sdr',closers:'closer',onboarding:'onb'};

const IC={
  mensal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M3 10h18M8 2v4M16 2v4"/></svg>',
  wsales:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><rect x="7" y="10" width="3" height="7"/><rect x="12" y="6" width="3" height="11"/><rect x="17" y="13" width="3" height="4"/></svg>',
  warea:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/></svg>',
  oneone:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>'
};
const MEETINGS=[{k:'mensal',label:'Mensal Sales'},{k:'wsales',label:'Semanal Sales'},{k:'warea',label:'Semanal Área'},{k:'oneone',label:'1:1 Gestor'}];
const AREA_TABS=[{k:'sdr',label:'SDR'},{k:'closers',label:'Closers'},{k:'onboarding',label:'Onboarding'}];

function mesLabel(m){if(!m)return '—';const [y,mm]=m.split('-');const nomes=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];return nomes[+mm-1]+'/'+y;}

// ---- WeekTrend: pequeno múltiplo de 4 semanas (Últ. em destaque) ----
function weekTrendHTML({label,sub,color,series,fmt,targets,flat,accentLabel,labelLast,height}){
  fmt=fmt||fN;
  const plotH=height||100;
  const vals=(series||[]).map(s=>s.valor);
  const tvals=(targets||[]).filter(v=>v!=null&&v>0);
  const max=(Math.max(...vals,...tvals,1))*1.18;
  const last=vals.length?vals[vals.length-1]:null;
  const prior=vals.length>1?vals[vals.length-2]:null;
  const wow=(prior!=null&&prior>0&&last!=null)?Math.round((last-prior)/prior*100):null;
  // labelLast (25/08/2026, a pedido do Gabriel: cards de GMV/Ticket médio da SDR): valor
  // formatado em R$ é mais largo que uma coluna de 12 semanas — rotular todas as colunas fazia
  // os números colarem uns nos outros. Com labelLast, só as últimas N colunas mostram o valor
  // (as demais continuam com o valor no title/tooltip do hover). Sem o parâmetro, mantém o
  // comportamento de sempre (todas rotuladas — gráficos de contagem, números curtos).
  // height (30/08/2026, a pedido do Gabriel: cards de GMV/Ticket médio) — a área do gráfico
  // (.wtplot) é 100px por padrão via CSS; passar height estica só esse gráfico (estilo inline
  // sobrepõe a classe), escalando as barras/meta proporcionalmente — não mexe nos outros usos.
  const cols=(series||[]).map((s,i)=>{
    const h=Math.max(2,(s.valor/max)*plotH);
    const isLast=i===series.length-1;
    const showVal=!labelLast||i>=series.length-labelLast;
    const t=targets?targets[i]:null;
    const tgt=(t!=null&&t>0)?`<div class="wttgt" style="bottom:${Math.min(plotH,(t/max)*plotH)}px"></div>`:'';
    return `<div class="wtcol" title="${s.semana}: ${fmt(s.valor)}${(t!=null&&t>0)?' · meta '+fmt(t):''}">
      <div class="wtplot" style="height:${plotH}px"><div class="wtval ${!flat&&isLast?'cur':''}">${showVal?fmt(s.valor):''}</div>
      <div class="wtbar" style="height:${h}px;background:${color};opacity:${flat?1:(isLast?1:.4)}"></div>${tgt}</div>
      <div class="wtlbl ${!flat&&isLast?'cur':''}">${s.semana.replace(/^\d{4}-/,'')}</div></div>`;
  }).join('');
  return `<div class="wt">
    <div class="wttop"><span class="wtlabel">${accentLabel?`<span class="nivpill">${label}</span>`:label}${sub?` <span class="wtsub">· ${sub}</span>`:''}</span>
    ${wow!=null?`<span class="wtwow ${wow>=0?'up':'down'}">${wow>=0?'▲':'▼'} ${Math.abs(wow)}% WoW</span>`:''}</div>
    <div class="wtchart">${cols||'<span class="miss">sem dado</span>'}</div>
  </div>`;
}
// barras empilhadas por semana (25/08/2026, a pedido do Gabriel: visão "Opps por nível", pedida
// pela diretoria, inspirada numa referência externa) — mesmo esqueleto visual do weekTrendHTML
// (.wt/.wtcol/.wtbar/.wttgt), só que o .wtbar vira um flex column-reverse com 1 div por
// segmento em vez de 1 cor sólida, pra empilhar os níveis dentro da mesma barra.
function stackedWeeksHTML({weeks,dataByWeek,targets,keys,colors,fmt}){
  fmt=fmt||fN;
  if(!weeks||!weeks.length) return '<span class="miss">Sem dado suficiente para o período.</span>';
  const totals=weeks.map(w=>keys.reduce((s,k)=>s+((dataByWeek(w)||{})[k]||0),0));
  const tvals=(targets||[]).filter(v=>v!=null&&v>0);
  const max=Math.max(...totals,...tvals,1)*1.18;
  const cols=weeks.map((w,i)=>{
    const d=dataByWeek(w)||{}, total=totals[i], h=Math.max(2,(total/max)*100);
    const t=targets?targets[i]:null;
    const tgt=(t!=null&&t>0)?`<div class="wttgt" style="bottom:${Math.min(100,(t/max)*100)}px"></div>`:'';
    const segs=keys.map(k=>{const v=d[k]||0,segH=total?(v/total)*h:0;return segH?`<div style="height:${segH}px;background:${colors[k]}"></div>`:'';}).join('');
    return `<div class="wtcol" title="${w}: ${fmt(total)}${(t!=null&&t>0)?' · meta '+fmt(t):''}">
      <div class="wtplot"><div class="wtval">${fmt(total)}</div>
      <div class="wtbar" style="height:${h}px;background:none;display:flex;flex-direction:column-reverse;overflow:hidden">${segs}</div>${tgt}</div>
      <div class="wtlbl">${w.replace(/^\d{4}-/,'')}</div></div>`;
  }).join('');
  const legend=`<div class="legend" style="margin-top:10px">${keys.map(k=>`<span><i class="sw" style="background:${colors[k]}"></i>${k}</span>`).join('')}${tvals.length?'<span><i class="sw" style="background:none;border-top:2px dashed var(--text);height:0;width:12px"></i>Meta</span>':''}</div>`;
  return `<div class="wt"><div class="wtchart">${cols}</div></div>${legend}`;
}
// comparação de 2 barras (Real MTD vs Budget MTD), cada uma empilhada pelas mesmas chaves —
// mesmo padrão visual do stackedWeeksHTML acima, só que com 2 colunas fixas em vez de semanas.
function mtdCompareHTML({real,budget,keys,colors,fmt}){
  fmt=fmt||fN;
  const realTot=keys.reduce((s,k)=>s+(real[k]||0),0), budTot=keys.reduce((s,k)=>s+(budget[k]||0),0);
  if(!realTot&&!budTot) return '<span class="miss">Sem dado suficiente para o mês.</span>';
  const max=Math.max(realTot,budTot,1)*1.18;
  const bar=(vals,total,label)=>{
    const h=Math.max(2,(total/max)*100);
    // valor de cada segmento em branco, centralizado (28/08/2026, a pedido do Gabriel: saber
    // quanto de Inbound/Outbound compõe o total sem precisar passar o mouse) — só rotula se o
    // segmento for alto o bastante pra caber o número sem espremer.
    const segs=keys.map(k=>{const v=vals[k]||0,segH=total?(v/total)*h:0;
      return segH?`<div style="height:${segH}px;background:${colors[k]};display:flex;align-items:center;justify-content:center;overflow:hidden" title="${k}: ${fmt(v)}">${segH>=12?`<span style="color:#fff;font-size:10px;font-weight:700;font-family:var(--font-mono)">${fmt(v)}</span>`:''}</div>`:'';
    }).join('');
    return `<div class="wtcol" title="${label}: ${fmt(total)}">
      <div class="wtplot"><div class="wtval cur">${fmt(total)}</div>
      <div class="wtbar" style="height:${h}px;background:none;display:flex;flex-direction:column-reverse;overflow:hidden;max-width:64px">${segs}</div></div>
      <div class="wtlbl cur">${label}</div></div>`;
  };
  const ating=budTot?Math.round(realTot/budTot*100):null;
  const legend=`<div class="legend" style="margin-top:10px">${keys.map(k=>`<span><i class="sw" style="background:${colors[k]}"></i>${k}</span>`).join('')}</div>`;
  return `<div class="wt">
    ${ating!=null?`<div style="text-align:right;margin-bottom:8px"><span class="wtwow ${ating>=100?'up':'down'}">Atingimento: ${ating}%</span></div>`:''}
    <div class="wtchart" style="justify-content:center;gap:36px">${bar(real,realTot,'Real MTD')}${bar(budget,budTot,'Budget MTD')}</div>
    ${legend}</div>`;
}
function weeklyTotals(metricObj){
  const weeks=Object.keys(metricObj||{}).sort();
  return weeks.map(w=>({semana:w,valor:NIV.reduce((s,n)=>s+((metricObj[w]||{})[n]||0),0)}));
}
function weeklyByNivel(metricObj,nivel){
  const weeks=Object.keys(metricObj||{}).sort();
  return weeks.map(w=>({semana:w,valor:(metricObj[w]||{})[nivel]||0}));
}

// ---- tabela agrupada / ranking ----
// alinhamento da coluna: 'r' (direita, padrão pra número solto) ou 'c' (centralizado — usado
// quando o cabeçalho tem ícone, pra valor e título ficarem visualmente alinhados no centro).
const alignClass=c=>c.align==='r'?'r':c.align==='c'?'c':'';
function groupedTable({rows,groupBy,groupOrder,groupLabel,cols,kind,totals,sort,hd}){
  if(!rows||!rows.length) return '<div class="card"><span class="miss">Sem pessoas com dado no período.</span></div>';
  // ordenação (clicável) por qualquer coluna com fn `sort` — ordena DENTRO de cada grupo.
  const sc=sort&&sort.key?cols.find(c=>c.key===sort.key&&c.sort):null;
  const num=v=>(v==null||isNaN(v))?-Infinity:v;
  const sortItems=arr=>sc?arr.slice().sort((a,b)=>{const d=num(sc.sort(a))-num(sc.sort(b));return sort.dir==='asc'?d:-d;}):arr;
  const aggRow=(label,items,strong)=>{const st=strong?' style="border-top:2px solid var(--text)"':'';
    return `<tr class="grouprow"><td${st}>${label}</td>${cols.map(c=>`<td class="${alignClass(c)}"${st}>${c.agg?`<span class="mono">${c.agg(items)}</span>`:''}</td>`).join('')}</tr>`;};
  let body='';
  if(groupBy){
    const groups={};
    rows.forEach(r=>{const g=groupBy(r);(groups[g]=groups[g]||[]).push(r);});
    const order=(groupOrder||Object.keys(groups)).filter(g=>groups[g]&&groups[g].length);
    order.forEach(g=>{
      const items=groups[g];
      const gcells=cols.map(c=>`<td class="${alignClass(c)}">${totals&&c.agg?`<span class="mono">${c.agg(items)}</span>`:''}</td>`).join('');
      body+=`<tr class="grouprow"><td>${groupLabel?groupLabel(g):g} <span class="miss">· ${items.length}</span></td>${gcells}</tr>`;
      body+=sortItems(items).map((r,i)=>rowHTML(r,i,cols,kind)).join('');
    });
    if(totals) body+=aggRow('Total geral', rows, true);
  } else {
    body=sortItems(rows).map((r,i)=>rowHTML(r,i,cols,kind)).join('');
    if(totals) body+=aggRow('Total geral', rows, true);
  }
  const ind=c=>(sort&&sort.key===c.key)?(sort.dir==='asc'?' ▲':' ▼'):'';
  // linha extra de super-cabeçalho (ex.: "Atual"/"Hist. 5 semanas"), só se alguma coluna
  // tiver `group` — colunas consecutivas com o mesmo `group` viram um único <th colspan>.
  let groupRow='';
  if(cols.some(c=>c.group)){
    const segs=[]; let i=0;
    while(i<cols.length){ const g=cols[i].group; let span=1; while(i+span<cols.length&&cols[i+span].group===g) span++; segs.push({g,span}); i+=span; }
    groupRow=`<tr class="tbl-grouphd"><th></th>${segs.map(s=>`<th colspan="${s.span}">${s.g||''}</th>`).join('')}</tr>`;
  }
  return `<div class="card" style="padding:0;overflow-x:auto">${hd?`<div class="tbl-hd">${hd}</div>`:''}<table class="tbl">
    <thead>${groupRow}<tr><th>Pessoa</th>${cols.map(c=>`<th class="${alignClass(c)}${c.sort?' sortable':''}" data-k="${c.key||''}">${c.icon?`<span class="th-ic">${c.icon}</span>`:''}${c.label}${ind(c)}</th>`).join('')}</tr></thead>
    <tbody>${body}</tbody></table></div>`;
}
function rowHTML(r,i,cols,kind){
  return `<tr class="rankrow" data-email="${r.email}" data-kind="${kind}">
    <td style="white-space:nowrap"><span class="mono idx">${String(i+1).padStart(2,'0')}</span>
      <span style="display:inline-flex;align-items:center;gap:8px;vertical-align:middle">${avatarHTML(r,22)}${displayName(r)}</span></td>
    ${cols.map(c=>`<td class="${alignClass(c)}">${c.render(r)}</td>`).join('')}
  </tr>`;
}
function bindRowClicks(root){
  root.querySelectorAll('tr.rankrow').forEach(tr=>{
    tr.onclick=()=>{ state.meeting='oneone'; state.pessoa={email:tr.dataset.email,kind:tr.dataset.kind}; render(); };
  });
}
function ministack(vals,colors){
  const t=vals.reduce((a,b)=>a+b,0)||1;
  return `<div class="ministack">${vals.map((v,i)=>`<div style="width:${v/t*100}%;background:${colors[i]}" title="${NIV[i]}: ${fN(v)}"></div>`).join('')}</div>`;
}
// ================= MENSAL SALES =================
const MENSAL_KPIS=[
  {k:'receita',lbl:'Net Revenue',cur:1,desc:'Receita líquida no mês fechado'},
  {k:'opps',lbl:'Opp',cur:0,desc:'Oportunidades criadas no mês'},
  {k:'cw',lbl:'CW',cur:0,desc:'Negócios fechados (Closed Won)'},
  {k:'gmv',lbl:'GMV',cur:1,desc:'Volume bruto transacionado'},
  {k:'activation',lbl:'Ativação 10K',cur:0,desc:'Contas ativadas (10k GMV)'},
];
function mensalKpiCard(c,act,bud,actPrev,mes,suffix,refLabel){
  const a=act?.[c.k]||0, b=bud?.[c.k]||0, aprev=actPrev?.[c.k];
  const att=pct(a,b);
  const mom=aprev?Math.round((a-aprev)/aprev*100):null;
  return `<div class="kpi"><span class="rail"></span><div class="lbl">${c.lbl}</div>

// 31/2026" não deixava claro a que dia aquilo correspondia; ajustado 14/08/2026 pro mesmo
// formato usado nos CSVs de calendário oficial da Astrobox): "26W31 (28/07)" — ano curto + W +
// semana com zero à esquerda + data (DD/MM) da segunda-feira que abre a semana, via
// weekStartLabel (já usada na Visão Cohort, mesma regra de semana do resto do projeto). `ww`
// já vem com zero à esquerda (ex. "01") na própria chave de semana, então não precisa padStart.
function semanaLabel(w){ if(!w)return '—'; const [y,ww]=w.split('-W'); return y.slice(2)+'W'+ww+' ('+weekStartLabel(w)+')'; }
// data (DD/MM) da segunda-feira que abre a semana — mesma regra de semana 1 parcial/2ª feira em
// diante já usada em build_data.js (weekStartUTC/firstMondayUTC), reimplementada aqui só pra
// legenda do gráfico da Visão Cohort (13/08/2026, a pedido do Gabriel — "DD/MM (semana NN)",
// igual o relatório de referência, em vez de "26-W27").
function firstMondayUTC(year){ const jan1=new Date(Date.UTC(year,0,1)); const add=(8-jan1.getUTCDay())%7; const d=new Date(jan1); d.setUTCDate(d.getUTCDate()+add); return d; }
function weekStartDateUTC(w){ const [ys,ws]=w.split('-W'); const year=+ys, wn=+ws; if(wn===1) return new Date(Date.UTC(year,0,1)); const fm=firstMondayUTC(year); const d=new Date(fm); d.setUTCDate(d.getUTCDate()+(wn-2)*7); return d; }

// servindo só a Semanal Área). As duas bases oficiais já têm porEstrategia (derivado por
// proporção em cima do mensal, 14/08) — filtro de Estratégia funciona normal nos dois casos.
// 'actual' não tem semanalOficial (só existe pra budget/reforecast) — continua em `semanal`.

// "Outbound + N2-N3"), diferente da Semanal Área. Usa porNivelEstrategia quando os dois estão
// filtrados, porNivel/porEstrategia quando só um, total quando nenhum.

  const m=(src==='actual'?D.actual?.semanal:D[src]?.semanalOficial)?.[semana]; if(!m)return null;

const CLOSER_FTE_NIV_COLORS=[['N2-N3','#F04438'],['N4-N5','#12B76A'],['N6+','#101828']];
function closerOppsPorFteHTML(){

  const ultimaFechada=D.semanaFechada&&D.semanaFechada.semana;
  const rowsFechadas=((D.closerEstoque&&D.closerEstoque.all)||[]).filter(r=>!ultimaFechada||r.semana<=ultimaFechada);
  const baseWeeks=rowsFechadas.slice(-6).map(r=>r.semana);
  if(!baseWeeks.length) return '<span class="miss">Sem série de estoque — regenere o app_data.js com o build_data.js atualizado.</span>';

    const estByWeek={}; ((D.closerEstoque&&D.closerEstoque[niv])||[]).forEach(r=>estByWeek[r.semana]=r);
    const headcountPorMes=(D.closerHeadcountMes&&D.closerHeadcountMes[niv])||{};
    const vals=baseWeeks.map(w=>{
      const r=estByWeek[w], mes=D.semanaMes&&D.semanaMes[w], head=mes?headcountPorMes[mes]:null;
      if(!r||!head) return null;

  // vazia, porque os valores (17-26) nunca chegam perto de 0) — "zoom" na faixa que realmente
  // varia, com uma margem de 15% pra não colar a linha mais baixa no rodapé.
  const maxV=Math.max(...allVals), rawMinV=Math.min(...allVals), pad=(maxV-rawMinV)*0.15||1;
  const minV=Math.max(0,rawMinV-pad), range=(maxV-minV)||1;

  const H=280;
  const lines=series.map(s=>{

  }).join('');

  // abaixo do PRÓPRIO ponto", mas o próprio ponto agora estava ACIMA do N6+, então o rótulo
  // acabava colado bem em cima de onde o N6+ estava, ilegível. Voltei pro empilhamento por
  // VALOR real (maior valor em cima, sempre bate com a ordem visual das linhas, inclusive no
  // cruzamento) — cada rótulo nasce "GAP acima do próprio ponto" e só é empurrado pra baixo o
  // mínimo necessário quando invadiria o rótulo anterior; um traço fino da cor da série liga
  // ponto→rótulo sempre que ele precisar se afastar, pra nunca ficar ambíguo de quem é.
  // GAP/MIN_SEP menores (30/08/2026, a pedido do Gabriel) — com o eixo já "zoomado" no valor
  // real (ver minV acima), os pontos ficaram naturalmente mais espalhados, então o rótulo não

  const GAP=6, MIN_SEP=6, LEADER_THRESHOLD=1.2;

      return `<div style="position:absolute;left:${x}%;top:${p.y}%;transform:translate(-50%,-50%);width:6px;height:6px;border-radius:50%;background:${p.color};box-shadow:0 0 0 2px var(--surface)"></div>

    }).join('');
  }).join('');
  const legend=`<div class="legend" style="margin:0 0 10px">${series.map(s=>`<span><i class="sw" style="background:${s.color}"></i>${s.niv}</span>`).join('')}</div>`;
  // média dos 3 níveis por semana (30/08/2026, a pedido do Gabriel: referência rápida sem virar
  // uma 4ª linha disputando espaço com as outras 3) — média simples dos níveis com dado na

    return `<div style="flex:1;min-width:0;text-align:center">
      <div style="font-size:8.5px;color:var(--text-faint);font-family:var(--font-mono);white-space:nowrap">${w.replace('2025-','25').replace('2026-','26')}</div>

    </div>`; }).join('')}</div>`;
  return `${legend}<div style="position:relative;height:${H}px">
    <svg viewBox="0 0 100 100" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%;overflow:visible">${lines}${leaders}</svg>${dots}

// linha de OPPs recebidas (sólida, preta) + meta opps (tracejada) por cima das barras — mesmo
// visual do relatório de referência (12/08/2026, a pedido do Gabriel). A linha usa SVG (pontos
// conectados por polyline) porque a barra empilhada em div/CSS não dá pra "conectar" entre
// colunas; os pontos/rótulos em si são <div> absolutos (não SVG <text>) pra não distorcer o texto
// com o preserveAspectRatio="none" do SVG (que só serve pra esticar as LINHAS na largura certa).
function cohortLineHTML(periods,LH){
  const n=periods.length;
  const maxV=Math.max(...periods.map(p=>Math.max(p.total,p.metaOpps||0)),1);
  const yOf=v=>95-(v/maxV)*78; // % de cima pra baixo dentro da faixa (topo 17%, base 95%)
  const xOf=i=>(i+0.5)/n*100;
  const actualPts=periods.map((p,i)=>`${xOf(i)},${yOf(p.total)}`).join(' ');
  const metaPeriods=periods.filter(p=>p.metaOpps!=null);
  const metaPts=metaPeriods.map(p=>`${xOf(periods.indexOf(p))},${yOf(p.metaOpps)}`).join(' ');
  const dots=periods.map((p,i)=>{
    const x=xOf(i), y=yOf(p.total);

      <div style="position:absolute;left:${x}%;top:${y}%;transform:translate(-50%,-190%);background:#101828;color:#fff;font-size:10px;font-weight:700;padding:2px 7px;border-radius:9px;white-space:nowrap">${fN(p.total)}</div>`;
  }).join('');

  // referência (13/08/2026, a pedido do Gabriel). Usa a meta do 1º período com meta (a linha
  // tracejada pode variar mês a mês, diferente do relatório de referência que é sempre plana).
  const metaLbl=metaPeriods.length?`<div style="position:absolute;left:${xOf(periods.indexOf(metaPeriods[0]))}%;top:${yOf(metaPeriods[0].metaOpps)}%;transform:translate(-8%,-230%);color:var(--text-faint);font-size:10px;font-weight:700;white-space:nowrap">Meta opps: ${fN(metaPeriods[0].metaOpps)}</div>`:'';
  return `<div style="position:relative;height:${LH}px;margin-bottom:2px">
    <svg viewBox="0 0 100 100" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%;overflow:visible">
      ${metaPts?`<polyline points="${metaPts}" fill="none" stroke="#98A2B3" stroke-width="1.4" stroke-dasharray="3,2.4" vector-effect="non-scaling-stroke"/>`:''}
      <polyline points="${actualPts}" fill="none" stroke="#101828" stroke-width="1.8" vector-effect="non-scaling-stroke"/>
    </svg>${metaLbl}${dots}</div>`;
}

  ];
  // TODOS que contataram (por owner_email) na janela de 3 semanas — mescla com os dados de

  // (depois corrigir: excluir contas de time/cadência tipo bubr_bizops/bkf-team, e estratégia por owner.)

  let rowsOwner=[...ownerSet].map(o=>{ const p=sdrMap[o.toLowerCase()];

  if(estrF!=='all') rowsOwner=rowsOwner.filter(r=>r.estrategia===estrF); // filtro de estratégia: só SDRs atribuídos

// metas de produtividade por dia útil do Closer (Opp/BD, CW/BD), por estratégia — AINDA NÃO
// CONFIRMADAS com o time de Closer (diferente do BD_TGT de SDR, que veio de meta combinada).
// Mantido vazio de propósito: enquanto ficar {}, toda célula de produtividade/BD da página
// mostra o valor calculado + badge "⚠ a validar" em vez de % de atingimento (ver bdCellClo).
const BD_TGT_CLOSER={};
function renderAreaClosers(){
  const week=state.semanaArea;
  const base=D.porPessoa?.closer||[];
  const list=base.map(p=>weekView(p,week,CLOSER_DEF)).sort((a,b)=>b.cw-a.cw);
  // ===== filtro de sales_strategy (Outbound/Inbound/Hunting) — mesmo padrão da página SDR =====
  const estrF=state.estrArea||'all';
  // filtro de Nível (N2-N3/N4-N5/N6+) — independente do de Estratégia (31/07/2026, só
  // Closer/Onboarding): quando ativo, "substitui" a Estratégia nas buscas em D.closerXxx (as
  // estruturas ganharam as 3 chaves de nível como irmãs de all/Outbound/Inbound/Hunting, ver
  // CO_KEYS em build_data.js). Não filtra a LISTA de pessoas (listF/listTbl) — nível é atributo
  // do negócio, não do closer, então a tabela "por pessoa" continua mostrando todo mundo.
  const nivelF=state.nivelArea||'all';
  const filtF=nivelF!=='all'?nivelF:estrF;
  const listF=estrF==='all'?list:list.filter(p=>p.estrategia===estrF);
  // Entradas/saídas vêm das estruturas já gateadas por closer atribuído (lead-level, não soma
  // de pessoa) — mesmo padrão do SDR (sdrCohort/sdrOppsNivel em vez de somar a lista).
  const coh=(D.closerCohort?.[filtF]||{})[week]||null;
  const totOpps=coh?.opp||0;
  const totCw=(D.closerCw?.[filtF]||{})[week]||0;
  const totLost=(D.closerLost?.[filtF]||{})[week]||0;
  const refAgg=filtF==='all'?D[state.refArea]?.semanal?.[week]?.total:(nivelF!=='all'?D[state.refArea]?.semanal?.[week]?.porNivel?.[filtF]:D[state.refArea]?.semanal?.[week]?.porEstrategia?.[filtF]);
  const refT=refAgg;
  // Estoque do funil na POSIÇÃO da semana selecionada (snapshot), no filtro ativo (estratégia ou nível)
  const eCur=(D.closerEstoque?.[filtF]||[]).find(e=>e.semana===week);
  const estTot=eCur?eCur.opp+eCur.issues+eCur.sql+eCur.offer+eCur.contract:null;
  const totSaidas=totCw+totLost;
  const winRatePct=totSaidas?Math.round(totCw/totSaidas*100):null;
  // delta de estoque da semana = entradas − saídas = virou opp − (fechou ganho + perdeu)
  const deltaEst=totOpps-totCw-totLost;
  const deltaPill=`Δ estoque <span class="att ${deltaEst>=0?'hi':'lo'}">${deltaEst>=0?'▲ +':'▼ '}${fN(deltaEst)}</span>`;
  // C4 · SQL→CW — coorte isolada, ancorada na semana do SQL (não do opp): dos que chegaram a
  // SQL em W, quantos fecharam (CW) na MESMA semana.
  const cohSqlCw=(D.closerCohortSqlCw?.[filtF]||{})[week]||null;
  const c4Pct=cohSqlCw&&cohSqlCw.sql?Math.round(cohSqlCw.cw/cohSqlCw.sql*100):null;
  // FTE — closers que de fato receberam opp / fecharam CW na semana (mesma aproximação do SDR)
  const oppFteCount=(D.closerOppFte?.[filtF]||{})[week]||0;
  const cwFteCount=(D.closerCwFte?.[filtF]||{})[week]||0;
  const oppsFte=totOpps/Math.max(1,oppFteCount);
  const cwFte=totCw/Math.max(1,cwFteCount);
  const diasUteis=D.diasUteisSemana?.[week]||0;
  const oppsFteDia=diasUteis?oppsFte/diasUteis:null;
  const cwFteDia=diasUteis?cwFte/diasUteis:null;
  const bdt=BD_TGT_CLOSER[filtF]||{};
  const bdPill=(val,tgt)=>tgt?` <span class="att ${val!=null&&val>=tgt?'hi':'lo'}">${val!=null?Math.round(val/tgt*100):0}%</span>`:'';
  const oppBD=(bdt.opps?`meta ${bdt.opps}/BD${bdPill(oppsFteDia,bdt.opps)} · `:'')+`média ${oppsFte.toFixed(2)}/FTE · ${oppFteCount} closers · ${diasUteis} BD`;
  const cwBD=(bdt.cw?`meta ${bdt.cw}/BD${bdPill(cwFteDia,bdt.cw)} · `:'')+`média ${cwFte.toFixed(2)}/FTE · ${cwFteCount} closers · ${diasUteis} BD`;
  const kpis=[
    ['Entradas',fN(totOpps),metaSub(totOpps,refT?.opps,`${listF.length} closers`),'Oportunidades recebidas (Opp in)',null,KIC.entradas],
    ['Saídas do funil',fN(totSaidas),`${fN(totCw)} CW · ${fN(totLost)} lost${winRatePct!=null?` · win rate ${winRatePct}%`:''}`,'Fechados: ganhos + perdidos',null,KIC.saidas],
    ['Estoque atual',estTot!=null?fN(estTot):'—',deltaPill,'Funil de negociação atual (Opp/SQL/Offer/Contract)',null,KIC.estoque],
    ['Opps em Issues',eCur&&eCur.issues!=null?fN(eCur.issues):'—','Ainda não chegou a SQL','Estágio "Issues Identified" do funil, snapshot atual',null,KIC.estoque],
    ['C4 · SQL→CW',c4Pct!=null?c4Pct+'%':'—',cohSqlCw?`${fN(cohSqlCw.cw)}/${fN(cohSqlCw.sql)} em SQL`:'sem dado','Coorte: fechou (CW) na mesma semana do SQL',null,KIC.link],
    ['Opp / FTE / BD',oppsFteDia!=null?oppsFteDia.toFixed(2):'—',oppBD,'Oportunidades por FTE / dia útil',null,KIC.users],
    ['CW / FTE / BD',cwFteDia!=null?cwFteDia.toFixed(2):'—',cwBD,'Negócios fechados por FTE / dia útil','kpi-accent',KIC.target],
  ];
  const cwNivelSrc=D.semanalPorNivel?.cw||{};
  // target line = meta de CW por nível×estratégia. Base oficial de calendário útil, respeitando
  // Budget/Reforecast (17/08/2026, ver tgtOpps acima pro mesmo ajuste no SDR).
  const tgtCw=(w,n)=>{ const b=D[state.refArea]?.semanalOficial?.[w]; if(!b) return null;
    const cell=estrF==='all'?b.porNivel?.[n]:b.porNivelEstrategia?.[n]?.[estrF]; return cell?cell.cw:null; };
  const wt=NIV.map((n,i)=>{ const ser=weeklyByNivel(cwNivelSrc,n).slice(-8); const tg=ser.map(s=>tgtCw(s.semana,n));
    return `<div class="card">${weekTrendHTML({label:n,color:'#667085',series:ser,targets:tg,flat:true,accentLabel:true})}</div>`; }).join('');
  // resumo de produtividade por FTE (uma linha) — mesmo padrão do SDR.
  const prodResumo=`<div class="card" style="display:flex;gap:30px;flex-wrap:wrap;align-items:center;padding:16px 22px">
    <span class="eyebrow">Produtividade por FTE · ${semanaLabel(week)}${filtF!=='all'?' · '+filtF:''}</span>
    <span><b style="font-size:16px">${oppFteCount}</b> <span style="color:var(--text-muted);font-size:12px">FTEs (receberam opp)</span></span>
    <span><b style="font-size:16px">${oppsFte.toFixed(2)}</b> <span style="color:var(--text-muted);font-size:12px">opps/FTE</span></span>
    <span><b style="font-size:16px">${oppsFteDia!=null?oppsFteDia.toFixed(2):'—'}</b> <span style="color:var(--text-muted);font-size:12px">opps/FTE/dia útil (${diasUteis}d)</span></span>
    <span><b style="font-size:16px">${cwFteCount}</b> <span style="color:var(--text-muted);font-size:12px">FTEs (fecharam CW)</span></span>
    <span><b style="font-size:16px">${cwFte.toFixed(2)}</b> <span style="color:var(--text-muted);font-size:12px">CW/FTE</span></span>
    <span><b style="font-size:16px">${cwFteDia!=null?cwFteDia.toFixed(2):'—'}</b> <span style="color:var(--text-muted);font-size:12px">CW/FTE/dia útil (${diasUteis}d)</span></span>
  </div>`;
  // janela de referência (semana atual + últimas 5, mesmo padrão da tabela SDR).
  const idxW=D.semanas.indexOf(week);
  const weeks5=[0,1,2,3,4].map(i=>D.semanas[idxW-i]).filter(Boolean);
  // mesma janela de 5 semanas, deslocada 1 semana pra trás — usada só pra calcular a variação
  // semana a semana (WoW) da produtividade, já que ainda não há meta confirmada (BD_TGT_CLOSER).
  const weeks5Prev=[1,2,3,4,5].map(i=>D.semanas[idxW-i]).filter(Boolean);
  const cwAt=(r,w)=>{const x=w&&(r.porSemana||{})[w];return x?(x.cw||0):0;};
  const oppsAt=(r,w)=>{const x=w&&(r.porSemana||{})[w];return x?(x.opps||0):0;};
  const oppCwAt=(r,w)=>{const x=w&&(r.porSemana||{})[w];return x?(x.oppCw||0):0;};
  // C1 por pessoa: dos que a pessoa recebeu como opp NA semana W, quantos chegaram a SQL na
  // MESMA semana. Lê direto de porSemana (sem mapa auxiliar — closer, ao contrário do SDR, não
  // tem o problema de atribuição tardia que motivou o sdrOwnerCohort).
  const cohAt=(r,w)=>{const x=w&&(r.porSemana||{})[w];return (x&&x.cohOpp)?Math.round(x.cohSql/x.cohOpp*100):null;};
  // mix de CW por nível na janela de 5 semanas (mesma janela das outras colunas de histórico).
  const cwNivel5=r=>{const a=[0,0,0]; weeks5.forEach(w=>{const x=w&&(r.porSemana||{})[w]; if(x&&x.cwNivel) x.cwNivel.forEach((v,j)=>a[j]+=v||0);}); return a;};
  const nivelPct=(r,i)=>{const a=cwNivel5(r); const t=(a[0]+a[1]+a[2])||1; return Math.round((a[i]||0)/t*100);};
  const diasUteis5=weeks5.reduce((s,w)=>s+(D.diasUteisSemana?.[w]||0),0);
  const diasUteis5Prev=weeks5Prev.reduce((s,w)=>s+(D.diasUteisSemana?.[w]||0),0);
  const sumBy=(rows,f)=>rows.reduce((s,r)=>s+(f(r)||0),0);
  const c2Agg=(rows,w)=>{let co=0,cs=0;rows.forEach(r=>{const x=w&&(r.porSemana||{})[w];if(x){co+=x.cohOpp||0;cs+=x.cohSql||0;}});return co?Math.round(cs/co*100)+'%':'—';};
  const nivAgg=(rows,i)=>{const a=[0,0,0];rows.forEach(r=>{const ai=cwNivel5(r);a[0]+=ai[0];a[1]+=ai[1];a[2]+=ai[2];});const t=(a[0]+a[1]+a[2])||1;return Math.round((a[i]||0)/t*100)+'%';};
  // produtividade/dia útil E coorte C1/Opp→CW, todos na janela de 5 semanas — agregador =
  // MÉDIA por closer (produtividade) ou taxa recalculada (coortes, não é média de %).
  const pdOppFn=r=>diasUteis5?weeks5.reduce((s,w)=>s+oppsAt(r,w),0)/diasUteis5:null;
  const pdCwFn=r=>diasUteis5?weeks5.reduce((s,w)=>s+cwAt(r,w),0)/diasUteis5:null;
  const pdOppFnPrev=r=>diasUteis5Prev?weeks5Prev.reduce((s,w)=>s+oppsAt(r,w),0)/diasUteis5Prev:null;
  const pdCwFnPrev=r=>diasUteis5Prev?weeks5Prev.reduce((s,w)=>s+cwAt(r,w),0)/diasUteis5Prev:null;
  const cohSum5=r=>{let co=0,cs=0;weeks5.forEach(w=>{const x=w&&(r.porSemana||{})[w];if(x){co+=x.cohOpp||0;cs+=x.cohSql||0;}});return{co,cs};};
  const cohRate5=r=>{const{co,cs}=cohSum5(r);return co?Math.round(cs/co*100):null;};
  const c2Agg5=rows=>{let co=0,cs=0;rows.forEach(r=>weeks5.forEach(w=>{const x=w&&(r.porSemana||{})[w];if(x){co+=x.cohOpp||0;cs+=x.cohSql||0;}}));return co?Math.round(cs/co*100)+'%':'—';};
  // Opp→CW acumulado das opps recebidas nas últimas 5 semanas (mesmo espírito do Opp→SQL·5s

  const oppCwRate5=r=>{const o=opp5Sum(r);return o?Math.round(oppCw5Sum(r)/o*100):null;};
  const mediaAgg=(rows,f,dec)=>{const v=rows.map(f).filter(x=>x!=null);return v.length?(v.reduce((s,x)=>s+x,0)/v.length).toFixed(dec):'—';};
  // célula BD: valor + pill de variação semana a semana (WoW, janela de 5s atual vs anterior).
  // BD_TGT_CLOSER ainda vazio (sem meta confirmada) — usar WoW no lugar de atingimento vs meta.
  const wowDelta=(v,p)=>{if(p==null||!p)return '';return ` <span class="att ${v>=p?'hi':'lo'}">${v>=p?'+':''}${Math.round((v/p-1)*100)}%</span>`;};
  const bdCellClo=(v,p,dec)=>`<span class="mono">${v!=null?v.toFixed(dec):'—'}</span>${(v!=null&&p!=null)?wowDelta(v,p):''}`;
  const bdAgg=(rows,f,fPrev,dec)=>{const v=mediaAgg(rows,f,dec),n=parseFloat(v),pv=rows.map(fPrev).filter(x=>x!=null),p=pv.length?pv.reduce((s,x)=>s+x,0)/pv.length:null;return (p!=null&&!isNaN(n))?`${v}${wowDelta(n,p)}`:v;};
  const TI={pd:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>',c:KIC.users,conn:KIC.link,opp:KIC.target,niv:KIC.estoque};
  const cols=[
    {key:'contA',label:'Opp in · sem.',align:'c',icon:TI.c,render:r=>`<span class="mono">${fN(oppsAt(r,week))}</span>`,agg:rows=>fN(sumBy(rows,r=>oppsAt(r,week))),sort:r=>oppsAt(r,week)},

// metas de produtividade por dia útil do Onboarding (CW/BD, Ativado/BD), por estratégia —

function renderAreaOnboarding(){

  // filtro de Nível (N2-N3/N4-N5/N6+) — independente do de Estratégia (31/07/2026), mesmo
  // esquema do renderAreaClosers acima: substitui a Estratégia nas buscas, não filtra a lista
  // de pessoas (nível é atributo do negócio, não do onboarder).
  const nivelF=state.nivelArea||'all';
  const filtF=nivelF!=='all'?nivelF:estrF;

  // Entradas/saídas vêm das estruturas gateadas por onboarder atribuído (lead-level), mesmo

  const coh=(D.onbCohort?.[filtF]||{})[week]||null;
  const totCwIn=coh?.cw||0;
  const totAct=(D.onbAct?.[filtF]||{})[week]||0;
  const refAgg=filtF==='all'?D[state.refArea]?.semanal?.[week]?.total:(nivelF!=='all'?D[state.refArea]?.semanal?.[week]?.porNivel?.[filtF]:D[state.refArea]?.semanal?.[week]?.porEstrategia?.[filtF]);
  const refT=refAgg;
  // Estoque do funil na POSIÇÃO da semana selecionada (snapshot), no filtro ativo (estratégia ou nível)
  const eCur=(D.onbEstoque?.[filtF]||[]).find(e=>e.semana===week);
  const estTot=eCur?eCur.nuncaVendeu+eCur.vendendo+eCur.ativo:null;
  // delta de estoque da semana = entradas − saídas = fechou (CW) − ativou 10k (única saída

  const deltaPill=`Δ estoque <span class="att ${deltaEst>=0?'hi':'lo'}">${deltaEst>=0?'▲ +':'▼ '}${fN(deltaEst)}</span>`;
  // FTE — onboarders que de fato receberam CW / ativaram 10k na semana (mesma aproximação do SDR/Closer)
  const cwFteCount=(D.onbCwFte?.[filtF]||{})[week]||0;
  const actFteCount=(D.onbActFte?.[filtF]||{})[week]||0;
  const cwFte=totCwIn/Math.max(1,cwFteCount);
  const actFte=totAct/Math.max(1,actFteCount);
  const diasUteis=D.diasUteisSemana?.[week]||0;
  const cwFteDia=diasUteis?cwFte/diasUteis:null;
  const actFteDia=diasUteis?actFte/diasUteis:null;
  const bdt=BD_TGT_ONB[filtF]||{};

  const kpis=[

    ['Saídas do funil',fN((coh?.accomplished||0)+(coh?.unaccomplished||0)),coh?`${fN(coh.accomplished||0)} accomplished · ${fN(coh.unaccomplished||0)} unaccomplished`:'sem dado','Status atual do onboarding (quem fechou CW nessa semana)',null,KIC.saidas],

  const actNivelSrc=D.semanalPorNivel?.activation||{};
  // target line = meta de ativação por nível×estratégia. Base oficial de calendário útil,
  // respeitando Budget/Reforecast (17/08/2026, ver tgtOpps acima pro mesmo ajuste no SDR).
  const tgtAct=(w,n)=>{ const b=D[state.refArea]?.semanalOficial?.[w]; if(!b) return null;

  const wt=NIV.map((n,i)=>{ const ser=weeklyByNivel(actNivelSrc,n).slice(-8); const tg=ser.map(s=>tgtAct(s.semana,n));
    return `<div class="card">${weekTrendHTML({label:n,color:'#667085',series:ser,targets:tg,flat:true,accentLabel:true})}</div>`; }).join('');
  // resumo de produtividade por FTE (uma linha) — mesmo padrão do SDR/Closer.

    <span><b style="font-size:16px">${cwFte.toFixed(2)}</b> <span style="color:var(--text-muted);font-size:12px">CW/FTE</span></span>
    <span><b style="font-size:16px">${cwFteDia!=null?cwFteDia.toFixed(2):'—'}</b> <span style="color:var(--text-muted);font-size:12px">CW/FTE/dia útil (${diasUteis}d)</span></span>
    <span><b style="font-size:16px">${actFteCount}</b> <span style="color:var(--text-muted);font-size:12px">FTEs (ativaram)</span></span>
    <span><b style="font-size:16px">${actFte.toFixed(2)}</b> <span style="color:var(--text-muted);font-size:12px">ativados/FTE</span></span>
    <span><b style="font-size:16px">${actFteDia!=null?actFteDia.toFixed(2):'—'}</b> <span style="color:var(--text-muted);font-size:12px">ativados/FTE/dia útil (${diasUteis}d)</span></span>
  </div>`;
  // janela de referência (semana atual + últimas 5, mesmo padrão da tabela SDR/Closer).
  const idxW=D.semanas.indexOf(week);
  const weeks5=[0,1,2,3,4].map(i=>D.semanas[idxW-i]).filter(Boolean);
  // mesma janela de 5 semanas, deslocada 1 semana pra trás — usada só pra calcular a variação
  // semana a semana (WoW) da produtividade, já que ainda não há meta confirmada (BD_TGT_ONB).
  const weeks5Prev=[1,2,3,4,5].map(i=>D.semanas[idxW-i]).filter(Boolean);
  const cwAt=(r,w)=>{const x=w&&(r.porSemana||{})[w];return x?(x.cwIn||0):0;};
  const actAt=(r,w)=>{const x=w&&(r.porSemana||{})[w];return x?(x.activated||0):0;};
  const cwAct10kAt=(r,w)=>{const x=w&&(r.porSemana||{})[w];return x?(x.cwAct10k||0):0;};
  // C1 por pessoa: dos que o onboarder recebeu como CW NA semana W, quantos chegaram a 1k na
  // MESMA semana. Lê direto de porSemana, sem mapa auxiliar (mesmo padrão do Closer).
  const cohAt=(r,w)=>{const x=w&&(r.porSemana||{})[w];return (x&&x.cohCw)?Math.round(x.coh1k/x.cohCw*100):null;};
  // mix de ativação por nível na janela de 5 semanas (mesma janela das outras colunas de histórico).
  const actNivel5=r=>{const a=[0,0,0]; weeks5.forEach(w=>{const x=w&&(r.porSemana||{})[w]; if(x&&x.actNivel) x.actNivel.forEach((v,j)=>a[j]+=v||0);}); return a;};
  const nivelPct=(r,i)=>{const a=actNivel5(r); const t=(a[0]+a[1]+a[2])||1; return Math.round((a[i]||0)/t*100);};
  const diasUteis5=weeks5.reduce((s,w)=>s+(D.diasUteisSemana?.[w]||0),0);
  const diasUteis5Prev=weeks5Prev.reduce((s,w)=>s+(D.diasUteisSemana?.[w]||0),0);
  const sumBy=(rows,f)=>rows.reduce((s,r)=>s+(f(r)||0),0);
  const c2Agg=(rows,w)=>{let co=0,cs=0;rows.forEach(r=>{const x=w&&(r.porSemana||{})[w];if(x){co+=x.cohCw||0;cs+=x.coh1k||0;}});return co?Math.round(cs/co*100)+'%':'—';};
  const nivAgg=(rows,i)=>{const a=[0,0,0];rows.forEach(r=>{const ai=actNivel5(r);a[0]+=ai[0];a[1]+=ai[1];a[2]+=ai[2];});const t=(a[0]+a[1]+a[2])||1;return Math.round((a[i]||0)/t*100)+'%';};
  // produtividade/dia útil E coorte C1/CW→10K, todos na janela de 5 semanas — agregador =

  const pdCwFn=r=>diasUteis5?weeks5.reduce((s,w)=>s+cwAt(r,w),0)/diasUteis5:null;
  const pdActFn=r=>diasUteis5?weeks5.reduce((s,w)=>s+actAt(r,w),0)/diasUteis5:null;
  const pdCwFnPrev=r=>diasUteis5Prev?weeks5Prev.reduce((s,w)=>s+cwAt(r,w),0)/diasUteis5Prev:null;
  const pdActFnPrev=r=>diasUteis5Prev?weeks5Prev.reduce((s,w)=>s+actAt(r,w),0)/diasUteis5Prev:null;
  const cohSum5=r=>{let co=0,cs=0;weeks5.forEach(w=>{const x=w&&(r.porSemana||{})[w];if(x){co+=x.cohCw||0;cs+=x.coh1k||0;}});return{co,cs};};
  const cohRate5=r=>{const{co,cs}=cohSum5(r);return co?Math.round(cs/co*100):null;};
  const c2Agg5=rows=>{let co=0,cs=0;rows.forEach(r=>weeks5.forEach(w=>{const x=w&&(r.porSemana||{})[w];if(x){co+=x.cohCw||0;cs+=x.coh1k||0;}}));return co?Math.round(cs/co*100)+'%':'—';};
  // CW→10K acumulado dos CWs recebidos nas últimas 5 semanas (mesmo espírito do Opp→SQL·5s

  const cwAct10k5Sum=r=>weeks5.reduce((s,w)=>s+cwAct10kAt(r,w),0);
  const cwAct10kRate5=r=>{const c=cw5Sum(r);return c?Math.round(cwAct10k5Sum(r)/c*100):null;};
  const mediaAgg=(rows,f,dec)=>{const v=rows.map(f).filter(x=>x!=null);return v.length?(v.reduce((s,x)=>s+x,0)/v.length).toFixed(dec):'—';};
  // célula BD: valor + pill de variação semana a semana (WoW, janela de 5s atual vs anterior).

  const wowDelta=(v,p)=>{if(p==null||!p)return '';return ` <span class="att ${v>=p?'hi':'lo'}">${v>=p?'+':''}${Math.round((v/p-1)*100)}%</span>`;};
  const bdCellOnb=(v,p,dec)=>`<span class="mono">${v!=null?v.toFixed(dec):'—'}</span>${(v!=null&&p!=null)?wowDelta(v,p):''}`;
  const bdAgg=(rows,f,fPrev,dec)=>{const v=mediaAgg(rows,f,dec),n=parseFloat(v),pv=rows.map(fPrev).filter(x=>x!=null),p=pv.length?pv.reduce((s,x)=>s+x,0)/pv.length:null;return (p!=null&&!isNaN(n))?`${v}${wowDelta(n,p)}`:v;};
  const TI={pd:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>',c:KIC.users,conn:KIC.link,opp:KIC.target,niv:KIC.estoque};
  // carteira atual (05/08/2026 → 07/08/2026, a pedido do Gabriel): tamanho do book de cada

  const estoqueSemanaPorEmail=email=>{const arr=(D.onbEstoqueSemanalPorPessoa&&D.onbEstoqueSemanalPorPessoa[email])||[]; const by={}; arr.forEach(x=>by[x.semana]=x); return by;};
  const pctAtivos5Sum=email=>{const by=estoqueSemanaPorEmail(email); let ativo=0,tot=0; weeks5.forEach(w=>{const x=by[w]; if(x){ativo+=x.ativo; tot+=x.nuncaVendeu+x.vendendo+x.ativo;}}); return{ativo,tot};};

    {key:'carteira',label:'Carteira atual',align:'c',icon:TI.niv,render:r=>`<span class="mono">${fN(carteiraPorPessoa[r.email]||0)}</span>`,agg:rows=>fN(sumBy(rows,r=>carteiraPorPessoa[r.email]||0)),sort:r=>carteiraPorPessoa[r.email]||0},

function coaching(p,kind,squadArr,squadKey){
  const med=median(squadArr.map(x=>x[squadKey]));
  const mine=p[squadKey]||0;
  const d=[],m=[];let acao='';
  // flags (05/08/2026): mesmas condições usadas nos textos de "A melhorar" abaixo, só que como
  // booleano — servem pra comparar duas semanas estruturalmente (não por texto) no card de
  // "Ações em aberto" (ver openActions), já que os números mudam de semana pra semana mas a
  // CATEGORIA do gargalo é o que importa pra saber se ele persistiu.
  const flags={lowRate:false,belowMedian:mine<med};
  if(kind==='sdr'){
    if(p.contactRate!=null&&p.contactRate>=0.6)d.push(`Boa cobertura de contatos (${pctR(p.contactRate)}%)`);
    if(mine>=med)d.push('Opps acima da mediana do squad');
    flags.lowRate=p.contactRate!=null&&p.contactRate<0.45;
    if(flags.lowRate)m.push(`Cobertura de contatos baixa (${pctR(p.contactRate)}%)`);
    if(mine<med)m.push(`Opps abaixo da mediana do squad (${fN(mine)} vs ${fN(med)})`);
    acao=mine<med?'Priorizar geração de opps essa semana para recuperar o pacing do squad.':'Manter cadência e reforçar qualificação para melhorar a taxa de conexão.';
  } else if(kind==='closer'){
    if(p.winRate!=null&&p.winRate>=0.3)d.push(`Win rate forte (${pctR(p.winRate)}%)`);
    if(mine>=med)d.push('CW acima da mediana do squad');
    flags.lowRate=p.winRate!=null&&p.winRate<0.2;
    if(flags.lowRate)m.push(`Win rate abaixo do esperado (${pctR(p.winRate)}%)`);
    if(mine<med)m.push(`CW abaixo da mediana do squad (${fN(mine)} vs ${fN(med)})`);
    acao=(p.winRate!=null&&p.winRate<0.2)?'Revisar critério de qualificação dos deals com o gestor.':(mine<med?'Priorizar avanço das opps em aberto para recuperar o pacing.':'Manter ritmo e repassar abordagem para os pares do squad.');
  } else {
    if(p.actRate!=null&&p.actRate>=0.5)d.push(`Ativação alta (${pctR(p.actRate)}%)`);
    if(mine>=med)d.push('Ativações acima da mediana do squad');
    flags.lowRate=p.actRate!=null&&p.actRate<0.35;
    if(flags.lowRate)m.push(`Ativação baixa (${pctR(p.actRate)}%)`);
    if(mine<med)m.push(`Ativações abaixo da mediana do squad (${fN(mine)} vs ${fN(med)})`);
    acao=(p.actRate!=null&&p.actRate<0.35)?'Revisar contas paradas com o gestor antes que virem churn.':(mine<med?'Focar nas contas mais próximas de bater 10k GMV essa semana.':'Documentar o que está funcionando e replicar com o squad.');
  }
  if(!d.length)d.push('Desempenho dentro do esperado no período.');
  if(!m.length)m.push('Sem gargalo relevante identificado no período.');
  return {destaques:d,melhorar:m,acao,med,mine,flags};
}
// "Ações em aberto" (05/08/2026, a pedido do Gabriel): gerado por regra, não por texto livre —
// compara os FLAGS estruturais desta semana com os da semana anterior; o que persistiu nas
// duas é uma pendência que não foi resolvida entre um 1:1 e outro.
const OPEN_ACTION_LBL={
  sdr:{lowRate:'Cobertura de contatos segue baixa (abaixo de 45%) há 2 semanas seguidas.',belowMedian:'Opps seguem abaixo da mediana do squad há 2 semanas seguidas.'},
  closer:{lowRate:'Win rate segue abaixo do esperado (<20%) há 2 semanas seguidas.',belowMedian:'CW segue abaixo da mediana do squad há 2 semanas seguidas.'},
  onb:{lowRate:'Taxa de ativação segue baixa (<35%) há 2 semanas seguidas.',belowMedian:'Ativações seguem abaixo da mediana do squad há 2 semanas seguidas.'},
};
function openActions(kind,flags,flagsPrev){
  if(!flagsPrev) return ['Sem semana anterior para comparar (fora do período com dado).'];
  const out=[];
  for(const k of ['lowRate','belowMedian']) if(flags[k]&&flagsPrev[k]) out.push(OPEN_ACTION_LBL[kind][k]);
  if(!out.length) out.push('Nenhuma pendência recorrente — gargalos da semana passada não se repetiram.');
  return out;
}

    const rows=(window.SDR_LEADS||[]).filter(r=>r.owner===email&&weeksSet.has(r.semana));
    if(!rows.length){ alert('Sem leads pra exportar.'); return; }
    const cols=['leadId','semana','status','estr','contacted','connected','nurturing','qualified','unqualified'];

    const esc=v=>v==null?'':String(v).replace(/"/g,'""');
    const csv=[header.join(';')].concat(rows.map(r=>cols.map(c=>`"${esc(r[c])}"`).join(';'))).join('\n');
    const blob=new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=`sdr_leads_${email.split('@')[0]}.csv`;
    document.body.appendChild(a); a.click(); a.remove();
  });
}
// tabela "safrada" por pessoa (05/08/2026): mesmas métricas semanais já calculadas em
// p.porSemana (build_data.js), só que com SEMANA POR LINHA em vez de por coluna — mais fácil de
// ler várias semanas seguidas de uma pessoa só no 1:1.
const POR_SEMANA_COLS={
  sdr:[['contacted','Contatados',v=>fN(v)],['connected','Connected',v=>fN(v)],['contactRate','Contact→Connected',v=>v!=null?pctR(v)+'%':'—'],['opps','Opp in',v=>fN(v)],['diasContatoConectado','Ciclo contato→conectado',v=>v!=null?v+'d':'—']],
  closer:[['opps','Opp in',v=>fN(v)],['sql','SQL',v=>fN(v)],['sqlRate','Opp→SQL',v=>v!=null?pctR(v)+'%':'—'],['cw','CW',v=>fN(v)],['winRate','Win rate',v=>v!=null?pctR(v)+'%':'—'],['diasOppSql','Ciclo Opp→SQL',v=>v!=null?v+'d':'—'],['diasSqlWon','Ciclo SQL→CW',v=>v!=null?v+'d':'—']],
  onb:[['cwIn','CW in',v=>fN(v)],['activated','Ativados 10k',v=>fN(v)],['actRate','Taxa de ativação',v=>v!=null?pctR(v)+'%':'—'],['diasWonAtivacao','Ciclo CW→Ativação',v=>v!=null?v+'d':'—']],
};
function lastNWeeksAt(week,n){
  const idx=D.semanas.indexOf(week);
  if(idx<0) return [];
  return D.semanas.slice(Math.max(0,idx-n+1),idx+1);
}
function porSemanaTableHTML(p,kind,weeks){
  const cols=POR_SEMANA_COLS[kind];
  if(!weeks.length) return '<span class="miss">Sem semanas no período.</span>';
  const rows=weeks.slice().sort().reverse().map(w=>{
    const pw=(p.porSemana||{})[w]||{};
    return `<tr><td style="font-weight:600">${semanaLabel(w)}</td>${cols.map(([k,,fmt])=>`<td class="mono" style="text-align:center">${fmt(pw[k])}</td>`).join('')}</tr>`;
  }).join('');
  return `<table class="tbl" style="box-shadow:none"><thead><tr><th>Semana</th>${cols.map(([,lbl])=>`<th style="text-align:center">${lbl}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table>`;
}
function renderOneOne(){
  // a busca re-renderiza a página inteira a cada tecla (innerHTML recria o <input>, que perde
  // foco/cursor) — guarda se o campo estava focado e a posição do cursor pra restaurar depois.
  const searchEl0=document.getElementById('oneoneSearch');
  const hadFocus=document.activeElement===searchEl0;
  const caret=hadFocus?searchEl0.selectionStart:null;
  const people=allPeople();
  if(!people.length){ $('viewOneOne').innerHTML='<div class="card"><span class="miss">Sem pessoas com dado — rode build_data.js com os CSVs atualizados.</span></div>'; return; }
  // 05/08/2026 (a pedido do Gabriel): a lista lateral deixa de mostrar as 3 áreas juntas e passa
  // a alternar via subtabs (SDR/Closers/Onboarding, mesmo padrão da Semanal Área) — state.areaOneOne.
  const curKind=AREA_TO_ONEONE_KIND[state.areaOneOne]||'sdr';
  const peopleArea=people.filter(x=>x.kind===curKind);
  if(!state.pessoa||state.pessoa.kind!==curKind||!peopleArea.find(x=>x.p.email===state.pessoa.email)){
    state.pessoa=peopleArea.length?{email:peopleArea[0].p.email,kind:peopleArea[0].kind}:{email:people[0].p.email,kind:people[0].kind};
  }
  const sel=people.find(x=>x.p.email===state.pessoa.email&&x.kind===state.pessoa.kind);
  const q=(state.q||'').toLowerCase();
  const itemsSide=peopleArea.filter(x=>shortEmail(x.p.email).toLowerCase().includes(q)||displayName(x.p).toLowerCase().includes(q));
  const sideHTML=`<div class="eyebrow" style="margin:10px 4px 4px">${ROLE_CFG[curKind].label} · ${itemsSide.length}</div>`+
    itemsSide.map(x=>`<div class="oneone-item ${state.pessoa.email===x.p.email&&state.pessoa.kind===x.kind?'on':''}" data-email="${x.p.email}" data-kind="${x.kind}">${avatarHTML(x.p,24)}<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${displayName(x.p)}</span></div>`).join('');

  const week=state.semanaOneOne;
  const idxW=D.semanas.indexOf(week), prevWeek=idxW>0?D.semanas[idxW-1]:null;
  const cfg=ROLE_CFG[sel.kind];
  const defs=ONE_ONE_DEF[sel.kind];
  // projeta a pessoa E o squad inteiro na semana selecionada (mesmo weekView usado na Semanal
  // Área) — indicadores/coaching passam a refletir a semana, não mais o acumulado histórico.
  const selProj=weekView(sel.p,week,defs);
  // squad = só quem está ativo hoje (mesma população da lista lateral) — comparar contra o
  // histórico inteiro (ex-funcionários, gente que nunca teve atividade naquela semana) fazia
  // a mediana colapsar pra 0 em semanas normais, já que a maioria do roster fica de fora.
  const squadArr=people.filter(x=>x.kind===sel.kind).map(x=>weekView(x.p,week,defs));
  const co=coaching(selProj,sel.kind,squadArr,cfg.metricKey);
  const vsMed=co.med?Math.round((co.mine-co.med)/co.med*100):null;
  const wt=weekTrendHTML({label:displayName(sel.p).split(' ')[0],color:cfg.color,series:last4WeeklyAt(sel.p,week,cfg.metricKey)});
  // "Ações em aberto" (regra, não texto livre) — compara os flags desta semana com os da
  // anterior; o que persistir nas duas é pendência que não foi resolvida entre um 1:1 e outro.
  let coPrev=null;
  if(prevWeek){
    const selProjPrev=weekView(sel.p,prevWeek,defs);
    const squadArrPrev=people.filter(x=>x.kind===sel.kind).map(x=>weekView(x.p,prevWeek,defs));
    coPrev=coaching(selProjPrev,sel.kind,squadArrPrev,cfg.metricKey);
  }
  const abertos=openActions(sel.kind,co.flags,coPrev&&coPrev.flags);

  const estoqueHTML=personEstoqueBars(sel.kind,sel.p.email);
  const statusHTML=personStatusBars(sel.kind,sel.p.email);
  const semanasTabela=lastNWeeksAt(week,10);

  $('viewOneOne').innerHTML=`<div class="oneone">
    <div class="oneone-side">
      <input id="oneoneSearch" placeholder="Buscar pessoa…" value="${state.q||''}"/>
      ${sideHTML}
    </div>
    <div>
      <div class="card" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px;margin-bottom:16px">
        <div style="display:flex;align-items:center;gap:14px">
          ${avatarHTML(sel.p,52)}
          <div><div class="eyebrow">${cfg.label} · ${sel.p.email}</div><div style="font-size:22px;font-weight:700;margin-top:2px">${displayName(sel.p)}</div></div>
        </div>
        <div class="statrow">
          <div class="stat"><div class="eyebrow" style="color:var(--text-faint)">Resultado · ${semanaLabel(week)}</div><div class="v">${fN(co.mine)}</div></div>
          <div class="stat"><div class="eyebrow" style="color:var(--text-faint)">Mediana do squad</div><div class="v">${fN(Math.round(co.med))}</div></div>
          <div class="stat"><div class="eyebrow" style="color:var(--text-faint)">vs mediana</div><div class="v" style="color:${vsMed==null?'inherit':vsMed>=0?'var(--success)':'var(--danger)'}">${vsMed==null?'—':(vsMed>=0?'+':'')+vsMed+'%'}</div></div>
        </div>
      </div>
      <div class="grid g2">
        <div class="card"><div class="eyebrow" style="margin-bottom:14px">${cfg.metricLabel} · 4 semanas até ${semanaLabel(week)}</div>${wt}</div>
        <div class="card"><div class="eyebrow" style="margin-bottom:8px">Indicadores da semana</div>
          ${indicadores(selProj,sel.kind).map(([k,v])=>`<div class="indic"><span class="k">${k}</span><span class="v">${v}</span></div>`).join('')}</div>
      </div>
      <div class="coachgrid" style="margin-top:16px">
        <div class="card coachbox"><div class="eyebrow" style="color:var(--success);margin-bottom:10px">Destaques</div><ul>${co.destaques.map(t=>`<li>${t}</li>`).join('')}</ul></div>
        <div class="card coachbox"><div class="eyebrow" style="color:var(--warn);margin-bottom:10px">A melhorar</div><ul>${co.melhorar.map(t=>`<li>${t}</li>`).join('')}</ul></div>
        <div class="card coachbox"><div class="eyebrow" style="color:var(--accent);margin-bottom:10px">Ações da Semana</div><ul><li>${co.acao}</li></ul></div>
        <div class="card coachbox"><div class="eyebrow" style="color:var(--danger);margin-bottom:10px">Ações em aberto</div><ul>${abertos.map(t=>`<li>${t}</li>`).join('')}</ul></div>
      </div>
      <div class="sec" style="margin-top:16px"><div class="sec-head"><h2>Evolução do funil</h2>${granToggleHTML()}</div>
        <div class="grid g2">
          <div class="card">${cardHd(KIC.estoque,'Estoque · '+displayName(sel.p),null)}${estoqueHTML}</div>
          <div class="card">${cardHd(KIC.check,'Status atual por safra · '+displayName(sel.p),sel.kind==='sdr'?`<div class="gtoggle" style="display:inline-flex"><button class="on" onclick="exportSdrLeadsCsv('${sel.p.email}')">⬇ Exportar CSV</button></div>`:null)}${statusHTML}</div>
        </div>
      </div>
      <div class="sec" style="margin-top:16px"><div class="sec-head"><h2>Informações safradas por semana</h2><span class="hint">${displayName(sel.p)} · últimas ${semanasTabela.length} semanas, mais recente primeiro</span></div>
        <div class="card" style="padding:20px;overflow-x:auto">${porSemanaTableHTML(sel.p,sel.kind,semanasTabela)}</div>
      </div>
    </div>
  </div>`;
  $('oneoneSearch').oninput=e=>{state.q=e.target.value;renderOneOne();};
  $('viewOneOne').querySelectorAll('.oneone-item').forEach(el=>{
    el.onclick=()=>{state.pessoa={email:el.dataset.email,kind:el.dataset.kind};renderOneOne();};
  });
  if(hadFocus){
    const searchEl=$('oneoneSearch');
    searchEl.focus();
    searchEl.setSelectionRange(caret,caret);
  }
}

// ================= NAV / RENDER =================
const CTX={mensal:'Mês fechado',wsales:'Semana fechada',warea:'Semana · detalhe por FTE',oneone:'Semana · 1:1 gestor ↔ funcionário'};
function renderTabs(){
  $('tabs').innerHTML=MEETINGS.map(t=>`<div class="tab ${state.meeting===t.k?'on':''}" data-k="${t.k}"><span class="ic">${IC[t.k]||''}</span><span>${t.label}</span></div>`).join('');
  $('tabs').querySelectorAll('.tab').forEach(el=>el.onclick=()=>{state.meeting=el.dataset.k;document.body.classList.remove('side-open');render();});
  // subtabs SDR/Closers/Onboarding — reaproveitadas pelo 1:1 Gestor (05/08/2026) pra alternar
  // de área em vez de mostrar todo mundo junto numa lista só; cada aba guarda o próprio estado
  // (state.area pra Semanal Área, state.areaOneOne pro 1:1) pra não se atropelarem ao trocar de aba.
  const curArea=state.meeting==='oneone'?state.areaOneOne:state.area;
  $('subtabs').innerHTML=AREA_TABS.map(t=>`<div class="subtab ${curArea===t.k?'on':''}" data-k="${t.k}">${t.label}</div>`).join('');
  $('subtabs').querySelectorAll('.subtab').forEach(el=>el.onclick=()=>{
    if(state.meeting==='oneone') state.areaOneOne=el.dataset.k; else state.area=el.dataset.k;
    render();
  });
}
function updateBanner(){
  const dm=D.dataMax; const dmF=dm?dm.split('-').reverse().join('/'):'—';
  // hora do build (17/08/2026, a pedido do Gabriel) — geradoEmHora só existe em dados gerados
  // depois deste ajuste; em app_data.js antigo (sem o campo) some sem quebrar o texto.
  const horaF=D.geradoEmHora?` (${D.geradoEmHora})`:'';
  if(D.funilCompleto===false){
    $('bannerText').innerHTML=`Dados atualizados até <b>${dmF}${horaF}</b>. <b class="miss" style="color:var(--danger);font-style:normal">Funil completo (Contatado/Conectado/SQL por mês) parcial</b> — falta reexportar <code>Dados/05_produtividade.csv</code> (ver Dados/README.md).`;
  } else {
    $('bannerText').innerHTML=`Dados atualizados até <b>${dmF}${horaF}</b>`;
  }
}
function render(){
  renderTabs();
  const mt=MEETINGS.find(m=>m.k===state.meeting);
  $('pageTitle').textContent=mt?mt.label:'';
  $('ctxLine').textContent=CTX[state.meeting]+(state.meeting==='mensal'&&state.mesMensal?(' · '+mesLabel(state.mesMensal)):'')+(state.meeting==='oneone'&&state.semanaOneOne?(' · '+semanaLabel(state.semanaOneOne)):'');
  $('wsalesControls').style.display=state.meeting==='wsales'?'flex':'none';
  $('wareaControls').style.display=state.meeting==='warea'?'flex':'none';
  $('mensalControls').style.display=state.meeting==='mensal'?'flex':'none';
  $('otherControls').style.display=state.meeting==='oneone'?'flex':'none';
  $('subbar').style.display=(state.meeting==='warea'||state.meeting==='oneone')?'block':'none';
  if($('ctlEstrArea')) $('ctlEstrArea').style.display=state.meeting==='warea'?'flex':'none';
  if($('ctlNivelArea')) $('ctlNivelArea').style.display=(state.meeting==='warea'&&state.area!=='sdr')?'flex':'none';
  $('viewMensal').style.display=state.meeting==='mensal'?'block':'none';
  $('viewSemanal').style.display=state.meeting==='wsales'?'block':'none';
  $('viewArea').style.display=state.meeting==='warea'?'block':'none';
  $('viewOneOne').style.display=state.meeting==='oneone'?'block':'none';
  if(state.meeting==='mensal') renderMensal();
  else if(state.meeting==='wsales') renderSemanal();
  else if(state.meeting==='warea') renderArea();
  else renderOneOne();
}

$('genAt').textContent='dados de '+(D.geradoEm||'—');
$('menuBtn').onclick=()=>document.body.classList.toggle('side-open');
$('scrim').onclick=()=>document.body.classList.remove('side-open');
updateBanner();
initWsalesControls();
initWareaControls();
initMensalControls();
initOneOneControls();
render();
</script>
